name: CI/CD

on:
  push:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # Match the production server: testing on a newer PHP than we deploy
          # to lets 8.4-only syntax pass CI and fatal in production.
          php-version: "8.3"
          extensions: pdo_mysql,sqlite3,pdo_sqlite,mbstring,exif,bcmath,gd,zip,intl,pcntl
          coverage: none

      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test --compact

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            APP_PATH="${{ secrets.SERVER_APP_PATH }}"
            cd "$APP_PATH"

            git config --global --add safe.directory "$APP_PATH"
            git config --global --add safe.directory /var/www

            git fetch origin main
            git reset --hard origin/main

            composer install \
              --no-interaction --no-dev --prefer-dist --optimize-autoloader

            node -v
            rm -rf public/build
            npm ci --no-audit --no-fund
            npm run build
            test -d public/build/assets

            php artisan filament:assets
            php artisan livewire:publish --assets
            php artisan storage:link || true

            php artisan migrate --force

            php artisan optimize:clear
            php artisan project:cache

            chmod -R 775 storage bootstrap/cache || true

            # Tell the running queue workers to finish the current job and
            # exit; supervisor/systemd starts them again on the new code.
            php artisan queue:restart

            # New code is only picked up once OPcache is dropped.
            sudo systemctl reload php8.3-fpm || true

            echo "Deploy complete"
