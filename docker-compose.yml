services:
  nginx:
    image: nginx:1.27-alpine
    container_name: turizm-nginx
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/public:ro
      - ./storage/app/public:/var/www/public/storage:ro
    depends_on:
      - php
    networks:
      - app
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: turizm-php
    volumes:
      - ./:/var/www
      - vendor:/var/www/vendor
    env_file:
      - .env
    depends_on:
      - mysql
    networks:
      - app
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: turizm-mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-turizm}
      MYSQL_USER: ${DB_USERNAME:-turizm}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
    ports:
      - "33060:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5
    container_name: turizm-pma
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 128M
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - app
    restart: unless-stopped

networks:
  app:
    driver: bridge

volumes:
  mysql_data:
  vendor:
