services:
  nginx:
    image: nginx:1.27-alpine
    container_name: perfectum-nginx
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api/public:/var/www/api/public:ro
      - ./api/storage/app/public:/var/www/api/public/storage:ro
    depends_on:
      - php
    networks:
      - app
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: perfectum-php
    volumes:
      - ./api:/var/www/api
      - vendor:/var/www/api/vendor
    env_file:
      - api/.env
    networks:
      - app
    restart: unless-stopped

  node:
    image: node:24-alpine
    container_name: perfectum-node
    working_dir: /app
    command: sh -c "[ -d node_modules/nuxt ] || npm install --no-audit --no-fund; npm run dev -- --host 0.0.0.0"
    ports:
      - "3000:3000"
      - "24678:24678"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    env_file:
      - frontend/.env
    environment:
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3000
      NUXT_API_BASE: http://nginx/api/v1
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_HMR_HOST: localhost
      VITE_HMR_PORT: 24678
    networks:
      - app
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: perfectum-postgres
    environment:
      POSTGRES_DB: perfectum
      POSTGRES_USER: perfectum
      POSTGRES_PASSWORD: perfectum
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: perfectum-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - app
    restart: unless-stopped

networks:
  app:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  node_modules:
  vendor:
