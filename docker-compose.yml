services:
  nginx:
    image: nginx:1.27-alpine
    container_name: turizm-nginx
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/var/www
    depends_on:
      - app
    networks:
      - app
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: turizm-app
    volumes:
      - ./:/var/www
      - vendor:/var/www/vendor
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: turizm-scheduler
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./:/var/www
      - vendor:/var/www/vendor
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: turizm-queue
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=1", "--max-time=3600"]
    volumes:
      - ./:/var/www
      - vendor:/var/www/vendor
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app
    restart: unless-stopped

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: turizm-reverb
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "8080:8080"
    volumes:
      - ./:/var/www
      - vendor:/var/www/vendor
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app
    restart: unless-stopped

  onlyoffice:
    image: onlyoffice/documentserver:8.2
    container_name: turizm-onlyoffice
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-change-this-secret}
      JWT_HEADER: "Authorization"
    ports:
      - "8082:80"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_log:/var/log/onlyoffice
      - onlyoffice_cache:/var/lib/onlyoffice
      - onlyoffice_db:/var/lib/postgresql
      - ./docker/onlyoffice/header-logo.svg:/var/www/onlyoffice/documentserver/web-apps/common/main/resources/img/header/header-logo_s.svg:ro
      - ./docker/onlyoffice/header-logo.svg:/var/www/onlyoffice/documentserver/web-apps/common/main/resources/img/header/header-logo.svg:ro
    networks:
      - app
    restart: unless-stopped

networks:
  app:
    driver: bridge

volumes:
  vendor:
  onlyoffice_data:
  onlyoffice_log:
  onlyoffice_cache:
  onlyoffice_db:
