services:
  app:
    build:
      context: ./
      dockerfile: docker/Dockerfile
    container_name: perfectum-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - db
    networks:
      - perfectum

  nginx:
    image: nginx:1.21-alpine
    container_name: perfectum-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - perfectum

  db:
    image: mysql:8.0
    container_name: perfectum-db
    restart: unless-stopped
    ports:
      - "33060:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-perfectum}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-perfectum}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - perfectum

  phpmyadmin:
    image: phpmyadmin:5
    container_name: perfectum-pma
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 128M
    depends_on:
      - db
    networks:
      - perfectum

  node:
    image: node:18
    container_name: perfectum-node
    working_dir: /var/www
    environment:
      NODE_OPTIONS: --openssl-legacy-provider
    volumes:
      - ./:/var/www
      - node_modules:/var/www/node_modules
    command: sh -c "npm ci && npm run watch"
    networks:
      - perfectum

networks:
  perfectum:
    driver: bridge

volumes:
  db_data:
  node_modules:
