# Production stack. The database is EXTERNAL — point DB_* in .env at the managed
# MySQL; there is no db container here. Local development layers MySQL,
# phpMyAdmin and the Vite dev server on top via docker-compose.override.yml,
# which `docker compose` auto-merges. On the server the deploy runs
# `docker compose -f docker-compose.yml ...`, so the override is never applied.
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: turizm-nginx
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/var/www
    depends_on:
      - app
    networks:
      - app
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: turizm-app
    volumes:
      - ./:/var/www
      - vendor:/var/www/vendor
    env_file:
      - .env
    networks:
      - app
    restart: unless-stopped

  # Daemon that runs `schedule:run` once a minute — drives every task registered
  # in routes/console.php (CBU rate refresh, approval-reminder mailer, …). Uses
  # the same image as the web container; no host cron needed.
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: turizm-scheduler
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./:/var/www
      - vendor:/var/www/vendor
    env_file:
      - .env
    networks:
      - app
    restart: unless-stopped

  # Background queue worker — drives QUEUE_CONNECTION=database. Filament's
  # database-notifications broadcast goes through the queue, so without this the
  # bell drop-down would not light up in real time. --tries=3 keeps one bad job
  # from blocking the lane.
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: turizm-queue
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=1", "--max-time=3600"]
    volumes:
      - ./:/var/www
      - vendor:/var/www/vendor
    env_file:
      - .env
    networks:
      - app
    restart: unless-stopped

  # Laravel Reverb WebSocket server — the bell drop-down listens on it for new
  # database notifications in real time instead of polling.
  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: turizm-reverb
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "8080:8080"
    volumes:
      - ./:/var/www
      - vendor:/var/www/vendor
    env_file:
      - .env
    networks:
      - app
    restart: unless-stopped

  onlyoffice:
    image: onlyoffice/documentserver:8.2
    container_name: turizm-onlyoffice
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-change-this-secret}
      JWT_HEADER: "Authorization"
    ports:
      - "8082:80"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_log:/var/log/onlyoffice
      - onlyoffice_cache:/var/lib/onlyoffice
      - onlyoffice_db:/var/lib/postgresql
      # Brand the editor header with our logo. Community Edition silently
      # ignores the JWT `customization.logo`, so we override the shared logo
      # asset on disk instead (common/ is used by every editor).
      - ./docker/onlyoffice/header-logo.svg:/var/www/onlyoffice/documentserver/web-apps/common/main/resources/img/header/header-logo_s.svg:ro
      - ./docker/onlyoffice/header-logo.svg:/var/www/onlyoffice/documentserver/web-apps/common/main/resources/img/header/header-logo.svg:ro
    networks:
      - app
    restart: unless-stopped

networks:
  app:
    driver: bridge

volumes:
  vendor:
  onlyoffice_data:
  onlyoffice_log:
  onlyoffice_cache:
  onlyoffice_db:
