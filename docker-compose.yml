services:
  nginx:
    image: nginx:1.27-alpine
    container_name: turizm-nginx
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/var/www
    depends_on:
      - php
    networks:
      - app
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: turizm-php
    volumes:
      - ./:/var/www
      - vendor:/var/www/vendor
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app
    restart: unless-stopped

  # Daemon that runs `schedule:run` once a minute — drives every task
  # registered in routes/console.php (CBU rate refresh, approval-reminder
  # mailer, …). Uses the same PHP image as the web container; no cron
  # needed on the host.
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: turizm-scheduler
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./:/var/www
      - vendor:/var/www/vendor
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app
    restart: unless-stopped

  # Laravel Reverb WebSocket server — Filament's bell drop-down listens
  # on it for new database notifications in real time instead of polling
  # every 30s.
  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: turizm-reverb
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "8080:8080"
    volumes:
      - ./:/var/www
      - vendor:/var/www/vendor
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: turizm-mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-turizm}
      MYSQL_USER: ${DB_USERNAME:-turizm}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
    ports:
      - "33061:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - app
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5
    container_name: turizm-pma
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 128M
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - app
    restart: unless-stopped

  # Vite dev server for the Filament theme + app assets. Installs deps into
  # the named node_modules volume on first run (so Linux binaries never clash
  # with a host node_modules built on Windows/macOS), then runs `npm run dev`.
  # For production assets run `npm run build` instead.
  node:
    image: node:24-alpine
    container_name: turizm-node
    working_dir: /var/www
    command: sh -c "[ -d node_modules/vite ] || npm install --no-audit --no-fund; npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./:/var/www
      - node_modules:/var/www/node_modules
    environment:
      VITE_HOST: 0.0.0.0
      VITE_HMR_HOST: localhost
      VITE_USE_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    networks:
      - app
    restart: unless-stopped

  onlyoffice:
    image: onlyoffice/documentserver:8.2
    container_name: turizm-onlyoffice
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-change-this-secret}
      JWT_HEADER: "Authorization"
    ports:
      - "8082:80"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_log:/var/log/onlyoffice
      - onlyoffice_cache:/var/lib/onlyoffice
      - onlyoffice_db:/var/lib/postgresql
      # Brand the editor header with our logo. Community Edition silently
      # ignores the JWT `customization.logo`, so we override the shared logo
      # asset on disk instead (common/ is used by every editor).
      - ./docker/onlyoffice/header-logo.svg:/var/www/onlyoffice/documentserver/web-apps/common/main/resources/img/header/header-logo_s.svg:ro
      - ./docker/onlyoffice/header-logo.svg:/var/www/onlyoffice/documentserver/web-apps/common/main/resources/img/header/header-logo.svg:ro
    networks:
      - app
    restart: unless-stopped

networks:
  app:
    driver: bridge

volumes:
  mysql_data:
  vendor:
  node_modules:
  onlyoffice_data:
  onlyoffice_log:
  onlyoffice_cache:
  onlyoffice_db:
