services:
  nginx:
    image: nginx:1.27-alpine
    container_name: turizm-nginx
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/public:ro
      - ./storage/app/public:/var/www/public/storage:ro
    depends_on:
      - php
    networks:
      - app
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: turizm-php
    volumes:
      - ./:/var/www
      - vendor:/var/www/vendor
    env_file:
      - .env
    depends_on:
      - mysql
    networks:
      - app
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: turizm-mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-turizm}
      MYSQL_USER: ${DB_USERNAME:-turizm}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
    ports:
      - "33060:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5
    container_name: turizm-pma
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 128M
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - app
    restart: unless-stopped

  # OnlyOffice Document Server — the in-browser Word/Excel/PPT editor.
  # First boot takes ~1-2 min while it provisions its internal Postgres
  # + RabbitMQ; the editor JS lives at /web-apps/apps/api/documents/api.js.
  # JWT_SECRET here MUST match ONLYOFFICE_JWT_SECRET in the Laravel .env.
  onlyoffice:
    image: onlyoffice/documentserver:8.2
    container_name: turizm-onlyoffice
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-change-this-secret}
      JWT_HEADER: "Authorization"
    ports:
      - "8082:80"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_log:/var/log/onlyoffice
      - onlyoffice_cache:/var/lib/onlyoffice
      - onlyoffice_db:/var/lib/postgresql
    networks:
      - app
    restart: unless-stopped

networks:
  app:
    driver: bridge

volumes:
  mysql_data:
  vendor:
  onlyoffice_data:
  onlyoffice_log:
  onlyoffice_cache:
  onlyoffice_db:
