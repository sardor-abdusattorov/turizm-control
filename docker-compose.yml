services:
  nginx:
    image: nginx:1.27-alpine
    container_name: turizm-nginx
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/var/www
    depends_on:
      - php
    networks:
      - app
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: turizm-php
    volumes:
      - ./:/var/www
      - vendor:/var/www/vendor
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: turizm-scheduler
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./:/var/www
      - vendor:/var/www/vendor
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: turizm-postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE:-turizm}
      POSTGRES_USER: ${DB_USERNAME:-turizm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "54321:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-turizm} -d ${DB_DATABASE:-turizm}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - app
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: turizm-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@turizm.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-secret}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "8081:80"
    depends_on:
      - postgres
    networks:
      - app
    restart: unless-stopped

  node:
    image: node:24-alpine
    container_name: turizm-node
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - vendor:/var/www/vendor
      - node_modules:/var/www/node_modules
    networks:
      - app
    profiles:
      - tools

  onlyoffice:
    image: onlyoffice/documentserver:8.2
    container_name: turizm-onlyoffice
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-change-this-secret}
      JWT_HEADER: "Authorization"
    ports:
      - "8082:80"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_log:/var/log/onlyoffice
      - onlyoffice_cache:/var/lib/onlyoffice
      - onlyoffice_db:/var/lib/postgresql
      # Brand the editor header with our logo. Community Edition silently
      # ignores the JWT `customization.logo`, so we override the shared logo
      # asset on disk instead (common/ is used by every editor).
      - ./docker/onlyoffice/header-logo.svg:/var/www/onlyoffice/documentserver/web-apps/common/main/resources/img/header/header-logo_s.svg:ro
      - ./docker/onlyoffice/header-logo.svg:/var/www/onlyoffice/documentserver/web-apps/common/main/resources/img/header/header-logo.svg:ro
    networks:
      - app
    restart: unless-stopped

networks:
  app:
    driver: bridge

volumes:
  postgres_data:
  vendor:
  node_modules:
  onlyoffice_data:
  onlyoffice_log:
  onlyoffice_cache:
  onlyoffice_db:
