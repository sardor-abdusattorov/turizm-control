# Local development only. `docker compose` auto-merges this on top of
# docker-compose.yml, adding a MySQL database, phpMyAdmin and the Vite dev
# server, and making the PHP services wait for a healthy database. The
# production deploy uses `docker compose -f docker-compose.yml ...`, so none of
# this is ever started on the server (where MySQL is external).
services:
  app:
    depends_on:
      mysql:
        condition: service_healthy

  scheduler:
    depends_on:
      mysql:
        condition: service_healthy

  queue:
    depends_on:
      mysql:
        condition: service_healthy

  reverb:
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: turizm-mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-turizm}
      MYSQL_USER: ${DB_USERNAME:-turizm}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
    ports:
      - "33061:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - app
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5
    container_name: turizm-pma
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 128M
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - app
    restart: unless-stopped

  # Vite dev server for the Filament theme + app assets. Installs deps into the
  # named node_modules volume on first run (so Linux binaries never clash with a
  # host node_modules built on Windows/macOS), then runs `npm run dev`. For
  # production, assets are built in CI (`npm run build`) and shipped.
  node:
    image: node:24-alpine
    container_name: turizm-node
    working_dir: /var/www
    command: sh -c "[ -d node_modules/vite ] || npm install --no-audit --no-fund; npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./:/var/www
      - node_modules:/var/www/node_modules
    environment:
      VITE_HOST: 0.0.0.0
      VITE_HMR_HOST: localhost
      VITE_USE_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    networks:
      - app
    restart: unless-stopped

volumes:
  mysql_data:
  node_modules:
