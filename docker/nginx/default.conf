server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 100M;
    server_tokens off;

    # ─── Security headers ───────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ─── Gzip ───────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ─── Статические файлы — кэш на 6 месяцев ──────────────────────────────────
    location ~* \.(?:ico|gif|jpe?g|png|webp|svg|woff2?|ttf|eot|css|js|webmanifest)$ {
        expires 6M;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
        try_files $uri /index.php?$query_string;  # <-- было =404, стало fallback
    }

    # ─── Блокировка чувствительных файлов ──────────────────────────────────────
    location ~* \.(env|log|sql|bak|conf|ini|sh|bash)$ {
        deny all;
        return 404;
    }

    location ~* /(\.git|composer\.(json|lock)|package\.json|webpack\.mix\.js|artisan) {
        deny all;
        return 404;
    }

    # ─── Запрет исполнения PHP/скриптов в загрузках пользователей ──────────────
    # Любые файлы под /storage/ (включая uploads/applications/*) отдаём как
    # статику. Это защищает от RCE, если злоумышленник всё-таки сумеет
    # положить туда .php/.phtml/.phar/.htaccess и т.п.
    location ^~ /storage/ {
        location ~* \.(php|phtml|phar|pht|phps|cgi|pl|py|sh|bash)$ {
            deny all;
            return 404;
        }
        location ~* /\.ht {
            deny all;
            return 404;
        }
        try_files $uri =404;
    }

    # ─── Основной роутинг ───────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # ─── PHP-FPM ────────────────────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTPS on;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;

        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 16k;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
    }

    # ─── Запрет скрытых файлов и директорий ────────────────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }
}
