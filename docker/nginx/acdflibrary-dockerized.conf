# Внешний nginx (хост) для Docker-версии acdflibrary
# Копировать в /etc/nginx/sites-available/acdflibrary-dockerized.conf
# Приложение: /home/www/sardor_projects/acdflibrary
# Docker nginx слушает на APP_PORT=8001
#
# Создать пароль для /dbadmin/:
#   sudo htpasswd -c /etc/nginx/.htpasswd_pma sardor
#
# Создать пароль для всей админки (admin.acdflibrary.uz):
#   sudo htpasswd -c /etc/nginx/.htpasswd_admin sardor
#   # для добавления ещё одного пользователя — БЕЗ флага -c:
#   sudo htpasswd /etc/nginx/.htpasswd_admin teammate
#
# SSL:
#   certbot --nginx -d acdflibrary.uz -d www.acdflibrary.uz -d admin.acdflibrary.uz
#
# Активация:
#   ln -s /etc/nginx/sites-available/acdflibrary-dockerized.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

# ─── HTTP → HTTPS ──────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name acdflibrary.uz www.acdflibrary.uz admin.acdflibrary.uz;
    return 301 https://$host$request_uri;
}

# ─── acdflibrary.uz ────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name acdflibrary.uz www.acdflibrary.uz;

    ssl_certificate     /etc/letsencrypt/live/acdflibrary.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acdflibrary.uz/privkey.pem;

    client_max_body_size 100M;

    location / {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ─── admin.acdflibrary.uz ──────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name admin.acdflibrary.uz;

    ssl_certificate     /etc/letsencrypt/live/acdflibrary.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acdflibrary.uz/privkey.pem;

    client_max_body_size 100M;

    # ─── HTTP Basic Auth на весь admin-поддомен ────────────────────────────────
    # Ловим запрос ещё до PHP, защищая в т.ч. форму логина и livewire-эндпоинт.
    auth_basic           "Admin area";
    auth_basic_user_file /etc/nginx/.htpasswd_admin;

    location /dbadmin/ {
        auth_basic           "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd_pma;

        proxy_pass         http://127.0.0.1:8081/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
